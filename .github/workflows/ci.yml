name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  train:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download data
        run: python scripts/download_data.py
      - name: EDA figures
        run: python -m src.eda
      - name: Train and track models
        run: python -m src.train | tee training.log
      - name: Quality gate (fail if ROC-AUC < 0.80)
        run: |
          python - <<'EOF'
          import json, sys
          m = json.load(open("models/metrics.json"))
          auc = m["results"][m["best_model"]]["roc_auc"]
          print(f"Best model {m['best_model']} test ROC-AUC = {auc:.3f}")
          sys.exit(0 if auc >= 0.80 else 1)
          EOF
      - name: Upload model and reports
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/
            mlruns/
            training.log

  docker:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-and-reports
          path: .
      - name: Build image
        run: docker build -t heart-api:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 --name api heart-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
            -d @sample_request.json | tee prediction.json
          docker logs api
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: prediction.json
